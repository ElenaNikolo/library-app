name: library

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?λείπει από το .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?λείπει από το .env}
      POSTGRES_DB: ${POSTGRES_DB:?λείπει από το .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Το $$ περνάει ένα σκέτο $ μέσα στο container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
